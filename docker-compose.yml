# Starts the whole RaceDay platform with one command:
#
#   docker compose up --build
#
#   MVC web app  ->  http://localhost:5002
#   API + Swagger ->  http://localhost:5000/swagger
#   SQL Server   ->  localhost,14330  (user: sa, password: see SA_PASSWORD in .env)
#
# Copy .env.example to .env first and fill in your Azure Storage connection string.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-RaceDay_Passw0rd!}
    ports:
      - "14330:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  api:
    build:
      context: .
      dockerfile: RaceDay.Api/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=RaceDayDB;User Id=sa;Password=${SA_PASSWORD:-RaceDay_Passw0rd!};TrustServerCertificate=True;"
      AzureBlobStorage__ConnectionString: "${AZURE_STORAGE_CONNECTION_STRING:-}"
      AzureBlobStorage__ContainerName: "${AZURE_STORAGE_CONTAINER:-raceday-images}"
      Database__MigrateOnStartup: "true"
    ports:
      - "5000:8080"

  web:
    build:
      context: .
      dockerfile: RaceDay.Web/Dockerfile
    depends_on:
      - api
    environment:
      Api__BaseUrl: "http://api:8080/"
    ports:
      - "5002:8080"

volumes:
  sqldata:
